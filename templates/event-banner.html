<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SWE event banner (16:9)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens/swe.css">
<style>
  /* Edit the text in <body>. Export at 1920x1080 (see the README). All sizes are in cqw so the banner scales as one piece. */
  html, body { margin: 0; height: 100%; background: #05102a; }
  body { display: grid; place-items: center; overflow: hidden; }
  .canvas {
    width: min(100vw, calc(100vh * 16 / 9));
    aspect-ratio: 16 / 9;
    container-type: inline-size;
  }
  .banner {
    box-sizing: border-box;
    height: 100%;
    padding: 4.4cqw 4.6cqw;
    display: grid;
    grid-template-columns: 1fr 25cqw;
    gap: 4cqw;
    align-items: center;
    font-size: 1.6cqw;
  }
  .head { display: flex; align-items: center; gap: 1.2cqw; }
  .chip {
    display: grid; place-items: center;
    width: 3.6cqw; height: 2.6cqw;
    background: var(--swe-blue); border: .2cqw solid var(--swe-gold);
    box-shadow: .3cqw .3cqw 0 var(--swe-cobalt);
    color: var(--swe-gold); font: 800 1.4cqw/1 var(--swe-mono);
  }
  .swe-kicker { font-size: 1.45cqw; letter-spacing: .2em; color: var(--swe-steel); }
  .swe-title { margin-top: 3cqw; font-size: var(--title-size, 11cqw); }
  .tagline {
    display: flex; align-items: center; gap: 1.2cqw;
    margin: 3.2cqw 0 0;
    color: var(--swe-white);
    font: 700 1.9cqw/1.2 var(--swe-mono); letter-spacing: .14em; text-transform: uppercase;
  }
  .tagline::before { content: ""; flex: none; width: 7cqw; height: .7cqw; background: var(--swe-gold); }
  .where { display: flex; align-items: center; gap: 1.4cqw; margin-top: 3.4cqw; }
  .where::before { content: ""; flex: none; width: 1.3cqw; height: 2.6cqw; background: var(--swe-gold); }
  .where p { margin: 0; font: 700 1.25cqw/1.7 var(--swe-mono); letter-spacing: .16em; text-transform: uppercase; }
  .where .org { color: var(--swe-gold); }
  .where .place { color: var(--swe-steel); font-weight: 400; }
  .swe-panel img { display: block; width: 100%; }
</style>
</head>
<body>
<div class="canvas">
  <main class="banner swe-surface swe-grid">
    <div>
      <div class="head">
        <span class="chip" aria-hidden="true">&gt;_</span>
        <p class="swe-kicker">Software Engineering Club</p>
      </div>
      <!-- Long title? Lower --title-size, e.g. style="--title-size: 8cqw" -->
      <h1 class="swe-title">Weekly<br>Meeting</h1>
      <p class="tagline">[Day] [Time] @ [Room]</p>
      <div class="where">
        <div>
          <p class="org">University of North Georgia</p>
          <p class="place">Dahlonega, Georgia</p>
        </div>
      </div>
    </div>
    <aside class="swe-panel">
      <div class="swe-panel__bar"><b>~/ung</b> // swe</div>
      <img src="../assets/logo/swe-mark.svg" alt="UNG Software Engineering Club">
    </aside>
  </main>
</div>
</body>
</html>
